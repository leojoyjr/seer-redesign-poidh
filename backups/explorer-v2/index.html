<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Seer App</title>
    <meta name="description" content="Find, understand and trade across Seer information markets.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="seer-shell.css">
    <link rel="stylesheet" href="seer-subbar.css">
